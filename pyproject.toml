# Package metadata lives in setup.cfg rather than a [project] table: a
# setuptools older than 61 (e.g. macOS system Python's 58, which pip < 22 can
# pick up inside a --system-site-packages venv) ignores [project] and silently
# builds an empty "UNKNOWN 0.0.0" wheel. setup.cfg works with every setuptools.
[build-system]
requires = ["setuptools>=40.8", "wheel"]
build-backend = "setuptools.build_meta"
