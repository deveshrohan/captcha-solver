[metadata]
name = captcha-solver
# literal, not `attr:` -- old setuptools would import the package (and so
# torch) at build time; tests/test_package.py keeps it equal to __version__
version = 0.2.0
description = Offline readers for Indian government-portal captchas: identifies the captcha from the image, reads it, and retries until solved.
long_description = file: PACKAGE.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
url = https://github.com/deveshrohan/captcha-solver

[options]
python_requires = >=3.9
install_requires =
    numpy
    pillow
    torch
# The engine lives in ./solver (the repo's scripts import it as `solver`);
# installed, it becomes captcha_solver.engine so nothing generic like
# `solver` lands in site-packages.
packages =
    captcha_solver
    captcha_solver.engine
package_dir =
    captcha_solver.engine = solver

[options.package_data]
# Production weights only, listed by name (mirrors the .gitignore whitelist)
# so a stray experimental checkpoint in solver/ can never ship.
captcha_solver.engine =
    *.json
    model.pt
    securimage_model.pt
    gst_model.pt
    mca_model.pt
    epfo_model.pt
    itat_model.pt
    bharatkosh_model.pt
    calhc_model.pt
    itat2_model.pt

[options.extras_require]
http = requests
train =
    scipy
    fonttools
    requests

[options.entry_points]
console_scripts =
    captcha-solver = captcha_solver.cli:main
